{% extends "base.html" %}
{% block title %}Parolă nouă · Kin{% endblock %}
{% block wrapclass %}center-narrow{% endblock %}
{% block body %}
<div class="brand"><span class="dot"></span> Kin</div>
<div class="card">
  <h1>Alege o parolă nouă</h1>
  <form method="post">
    <label>Parolă nouă</label>
    <input type="password" name="password" required minlength="6" autofocus>
    <label>Repetă parola</label>
    <input type="password" name="password2" required minlength="6">
    <button class="btn" type="submit">Salvează parola</button>
  </form>
</div>
{% endblock %}
