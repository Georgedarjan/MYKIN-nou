<!DOCTYPE html>
<html lang="ro">
<body style="margin:0;padding:0;background:#F7F9FC;font-family:Arial,Helvetica,sans-serif;color:#13161A;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F7F9FC;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #E4E8EE;border-radius:20px;">
        <tr><td style="padding:32px 28px;">
          <p style="margin:0 0 24px;font-size:20px;font-weight:bold;color:#0B0E12;">
            <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#047AF2;margin-right:6px;"></span>Kin
          </p>
          <h1 style="margin:0 0 12px;font-size:22px;color:#0B0E12;">Resetează-ți parola</h1>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.55;color:#5A6572;">
            Ai cerut o parolă nouă pentru contul tău Kin. Apasă butonul de mai jos
            ca s-o alegi. Linkul e valabil 1 oră.
          </p>
          <p style="margin:0 0 24px;">
            <a href="{{ link }}" style="display:inline-block;background:#047AF2;color:#FFFFFF;text-decoration:none;font-weight:bold;font-size:15px;padding:14px 26px;border-radius:100px;">Alege o parolă nouă</a>
          </p>
          <p style="margin:0 0 8px;font-size:13px;line-height:1.5;color:#5A6572;">
            Dacă butonul nu merge, copiază linkul în browser:
          </p>
          <p style="margin:0 0 24px;font-size:12px;line-height:1.5;word-break:break-all;color:#0361C4;">{{ link }}</p>
          <p style="margin:0;font-size:13px;line-height:1.5;color:#5A6572;">
            Dacă nu tu ai cerut asta, ignoră emailul. Parola ta rămâne neschimbată.
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
