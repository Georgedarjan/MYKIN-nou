{% extends "base.html" %}
{% block title %}Ai uitat parola · Kin{% endblock %}
{% block wrapclass %}center-narrow{% endblock %}
{% block body %}
<div class="brand"><span class="dot"></span> Kin</div>
<div class="card">
  <h1>Ai uitat parola?</h1>
  <p class="muted small">Scrie emailul contului tău și îți trimitem un link
    prin care îți alegi o parolă nouă.</p>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <button class="btn" type="submit">Trimite linkul</button>
  </form>
</div>
<p class="footer-note"><a class="link" href="{{ url_for('login') }}">Înapoi la autentificare</a></p>
{% endblock %}
